name: Incipit Play Windows

on:
  workflow_dispatch:
    inputs:
      libplacebo_version:
        description: "libplacebo git tag to build"
        required: false
        default: "3be579e6c7f6b421d9ac3ab4860edc437c50b3eb"

permissions:
  contents: read

jobs:
  build:
    name: Build Incipit Play (MSYS2 x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-multimedia:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: ${{ github.event.inputs.libplacebo_version }}

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip -q ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy
        run: |
          ./scripts/deploy-windows-msys2.sh IncipitPlay-Win build/gui/IncipitPlay.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          # plugins that windeployqt added (multimedia, image formats) may need DLLs the first pass did not copy
          for pass in 1 2 3; do
            find IncipitPlay-Win -name '*.dll' | while read -r f; do
              objdump -p "$f" | awk '/DLL Name:/ { sub(/\r$/, "", $3); print $3 }' | while read -r n; do
                [ -n "$n" ] || continue
                [ "${n,,}" = "vulkan-1.dll" ] && continue
                if [ ! -f "IncipitPlay-Win/$n" ] && [ -f "/mingw64/bin/$n" ]; then
                  cp "/mingw64/bin/$n" IncipitPlay-Win/ && echo "extra: $n (for $f)"
                fi
              done
            done
          done
          cp LICENSES/AGPL-3.0-only-OpenSSL.txt IncipitPlay-Win/LICENSE-AGPL-3.0.txt
          cp COPYING IncipitPlay-Win/COPYING.txt
          echo "Incipit Play is based on chiaki-ng (https://github.com/streetpea/chiaki-ng), AGPL-3.0. Source code: https://github.com/dalmor0/incipit-play" > IncipitPlay-Win/CODIGO-FONTE.txt
          ls IncipitPlay-Win | head -100
          du -sh IncipitPlay-Win

      - name: Package portable
        run: |
          V_MAJ="$(grep 'CHIAKI_VERSION_MAJOR' CMakeLists.txt | grep -Eo '[0-9]+')"
          V_MIN="$(grep 'CHIAKI_VERSION_MINOR' CMakeLists.txt | grep -Eo '[0-9]+')"
          V_PAT="$(grep 'CHIAKI_VERSION_PATCH' CMakeLists.txt | grep -Eo '[0-9]+')"
          PKG="IncipitPlay-portatil-$V_MAJ.$V_MIN.$V_PAT-${GITHUB_SHA::7}.zip"
          zip -qr "$PKG" IncipitPlay-Win
          echo "PKG=${PKG}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: IncipitPlay-portatil
          path: ${{ env.PKG }}
          if-no-files-found: error
          retention-days: 14

      - name: Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: "scripts/incipit-play.iss"
          options: /O+

      - uses: actions/upload-artifact@v7
        with:
          name: IncipitPlay-instalador
          path: IncipitPlay-instalador.exe
          if-no-files-found: error
          retention-days: 14
